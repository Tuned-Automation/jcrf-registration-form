  /* ── Find or create mount point and inject ── */
  function init() {
    var config = window.SQ_RUGBY_FORM_CONFIG || {};
    var mount = document.getElementById('sqrf-mount');

    if (!mount) {
      mount = document.createElement('div');
      mount.id = 'sqrf-mount';
      document.body.appendChild(mount);
    }

    mount.innerHTML = FORM_HTML;
    bindForm(mount.querySelector('.sq-rugby-form-section'), mount);

    /* ── Scroll-driven visibility tied to the target section ── */
    var sectionId = config.targetSectionId;
    if (!sectionId) return;

    var anchorSection = document.querySelector('[data-section-id="' + sectionId + '"]');
    if (!anchorSection) return;

    var OFFSET = 50;
    var ticking = false;

    function onScroll() {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(function() {
        var rect = anchorSection.getBoundingClientRect();
        var sectionTop = rect.top - OFFSET;
        var sectionBottom = rect.bottom + OFFSET;
        var formHeight = mount.offsetHeight || 400;

        var visible = sectionTop < (window.innerHeight * 0.5) &&
                      sectionBottom > (formHeight + OFFSET);

        if (visible) {
          mount.classList.add('sqrf-visible');
        } else {
          mount.classList.remove('sqrf-visible');
        }
        ticking = false;
      });
    }

    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll, { passive: true });
    onScroll();
  }

  /* ── All form logic, scoped to the injected section ── */
  function bindForm(section, mount) {
    if (!section) return;
    var config = window.SQ_RUGBY_FORM_CONFIG || {};
    var currentPage = 0;
    var totalPages = 4;
    var hasLoadedForm = false;
    var CUSTOM_GRADE_VALUE = '__custom__';

    function isMobileViewport() {
      return window.matchMedia('(max-width: 799px)').matches;
    }

    function setMobileCollapsed(collapsed) {
      if (!mount || !isMobileViewport()) return;
      mount.classList.toggle('sqrf-mobile-collapsed', !!collapsed);
      mount.classList.toggle('sqrf-mobile-expanded', !collapsed);
    }

    var titleEl = section.querySelector('[data-sqrf-title]');
    if (titleEl) titleEl.textContent = config.formTitle || 'Register Your Team';

    var festivalSelect = section.querySelector('[data-sqrf-field="festival"]');
    var gradeSelect = section.querySelector('[data-sqrf-field="grade"]');

    function populateSelect(selectEl, items, placeholderText) {
      if (!selectEl || !items) return;
      while (selectEl.options.length > 1) selectEl.remove(1);
      if (placeholderText && selectEl.options[0]) {
        selectEl.options[0].textContent = placeholderText;
      }
      items.forEach(function(item) {
        var opt = document.createElement('option');
        if (typeof item === 'string') {
          opt.value = item;
          opt.textContent = item;
        } else {
          opt.value = item.value || item.label || '';
          opt.textContent = item.label || item.value || '';
        }
        selectEl.appendChild(opt);
      });
      selectEl.selectedIndex = 0;
    }

    function setSelectLoading(selectEl, loading) {
      if (!selectEl) return;
      var wrap = selectEl.closest('.sqrf-select-wrap');
      if (loading) {
        selectEl.classList.add('sqrf-loading');
        selectEl.disabled = true;
        if (wrap) wrap.classList.add('sqrf-loading-wrap');
      } else {
        selectEl.classList.remove('sqrf-loading');
        selectEl.disabled = false;
        if (wrap) wrap.classList.remove('sqrf-loading-wrap');
      }
    }

    function hideCustomGradeInput() {
      var customInput = section.querySelector('[data-sqrf-field="customGrade"]');
      if (!customInput) return;
      customInput.setAttribute('hidden', '');
      customInput.value = '';
      customInput.classList.remove('sqrf-input-error');
    }

    function onGradeChange() {
      var customInput = section.querySelector('[data-sqrf-field="customGrade"]');
      if (!customInput || !gradeSelect) return;
      if (gradeSelect.value === CUSTOM_GRADE_VALUE) {
        customInput.removeAttribute('hidden');
        customInput.focus();
      } else {
        hideCustomGradeInput();
      }
    }

    function populateGrades(items, placeholder) {
      populateSelect(gradeSelect, items, placeholder);
      if (gradeSelect) {
        var opt = document.createElement('option');
        opt.value = CUSTOM_GRADE_VALUE;
        opt.textContent = "Can't find your grade? Add your details to go on the waitlist";
        gradeSelect.appendChild(opt);
      }
      hideCustomGradeInput();
    }

    if (gradeSelect) {
      gradeSelect.addEventListener('change', onGradeChange);
    }

    var airtableConfig = config.airtable || {};
    var fetchUrl = airtableConfig.fetchOptionsUrl;

    function formatDate(dateStr) {
      if (!dateStr) return 'TBC';
      var parts = dateStr.split('-');
      if (parts.length !== 3) return dateStr;
      var day = parseInt(parts[0], 10);
      var month = parseInt(parts[1], 10) - 1;
      var year = parseInt(parts[2], 10);
      if (isNaN(day) || isNaN(month) || isNaN(year)) return dateStr;
      var months = ['January','February','March','April','May','June',
                    'July','August','September','October','November','December'];
      var suffix = 'th';
      if (day === 1 || day === 21 || day === 31) suffix = 'st';
      else if (day === 2 || day === 22) suffix = 'nd';
      else if (day === 3 || day === 23) suffix = 'rd';
      return day + suffix + ' ' + months[month] + ' ' + year;
    }

    function buildValue(name, dateStr) {
      var slug = (name || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
      if (dateStr) {
        var parts = dateStr.split('-');
        if (parts.length === 3) slug += '-' + parts[2] + '-' + parts[1] + '-' + parts[0];
      }
      return slug;
    }

    var festivalGradesMap = {};
    var festivalRecordIdMap = {};
    var festivalPostponementMap = {};

    function parseGrades(gradeField) {
      if (!gradeField) return [];
      var raw = Array.isArray(gradeField) ? gradeField.join(', ') : String(gradeField);
      return raw.split(',').map(function(g) { return g.trim(); }).filter(Boolean);
    }

    function sortGrades(grades) {
      return grades.slice().sort(function(a, b) {
        var numA = parseInt((a.match(/Y(\d+)/) || [])[1], 10) || 99;
        var numB = parseInt((b.match(/Y(\d+)/) || [])[1], 10) || 99;
        return numA - numB;
      });
    }

    function transformFestivals(arr) {
      var festivals = arr
        .map(function(item) {
          var name = item.Name || item.name || '';
          var date = item.Date || item.date || '';
          var val = buildValue(name, date);
          var grades = sortGrades(parseGrades(item.Grade || item.grade));
          var recordId = item.record_id || item.recordId || '';
          var postponement = item.PostponementDate || item['Postponement Date'] || item['postponement date'] || item.postponementDate || '';
          festivalGradesMap[val] = grades;
          festivalRecordIdMap[val] = recordId;
          festivalPostponementMap[val] = postponement;
          return {
            value: val,
            label: name + ' \u2014 ' + formatDate(date),
            sortKey: date ? date.split('-').reverse().join('') : '99999999'
          };
        })
        .sort(function(a, b) {
          return a.sortKey < b.sortKey ? -1 : a.sortKey > b.sortKey ? 1 : 0;
        });
      return festivals;
    }

    function updatePostponementCheckbox() {
      var selectedVal = festivalSelect ? festivalSelect.value : '';
      var postponeText = (festivalPostponementMap[selectedVal] || '').trim();
      var cbWrap = section.querySelector('[data-sqrf-cb="postponement"]');
      var label = section.querySelector('[data-sqrf-postponement-label]');
      if (!cbWrap) return;
      if (postponeText) {
        if (label) label.textContent = 'You are aware that the postponement date is set for ' + postponeText + ', and we will communicate this with your team';
        cbWrap.removeAttribute('hidden');
      } else {
        cbWrap.setAttribute('hidden', '');
        var input = cbWrap.querySelector('.sqrf-checkbox-input');
        if (input) { input.checked = false; cbWrap.classList.remove('sqrf-cb-checked'); }
      }
    }

    function onFestivalChange() {
      var selectedVal = festivalSelect ? festivalSelect.value : '';
      var grades = festivalGradesMap[selectedVal];
      if (grades && grades.length) {
        populateGrades(grades, 'Select a grade\u2026');
      } else {
        populateGrades(config.fallbackGrades || [], 'Select a grade\u2026');
      }
      updatePostponementCheckbox();
    }

    if (festivalSelect) {
      festivalSelect.addEventListener('change', onFestivalChange);
    }

    var gateway = section.querySelector('[data-sqrf-gateway]');
    var loadingScreen = section.querySelector('[data-sqrf-loading-screen]');
    var formContainer = section.querySelector('[data-sqrf-container]');
    var taglineEl = section.querySelector('[data-sqrf-tagline]');
    var mobileMinimiseBtn = section.querySelector('[data-sqrf-mobile-minimise]');

    var taglines = [
      "Rucking through the data to find your nearest festival\u2026",
      "Passing it down the backline\u2026 your events are almost here!",
      "Our halfback is digging the ball out\u2026 hang tight!",
      "Lacing up the boots and scanning for festivals near you\u2026"
    ];
    for (var ti = taglines.length - 1; ti > 0; ti--) {
      var tj = Math.floor(Math.random() * (ti + 1));
      var tmp = taglines[ti]; taglines[ti] = taglines[tj]; taglines[tj] = tmp;
    }

    var taglineTimer = null;
    function startTaglines() {
      var idx = 0;
      if (taglineEl) taglineEl.innerHTML = '<span class="sqrf-tagline-text">' + taglines[0] + '</span>';
      taglineTimer = setInterval(function() {
        var current = taglineEl ? taglineEl.querySelector('.sqrf-tagline-text') : null;
        if (current) {
          current.classList.add('sqrf-tag-out');
          setTimeout(function() {
            idx = (idx + 1) % taglines.length;
            if (taglineEl) taglineEl.innerHTML = '<span class="sqrf-tagline-text">' + taglines[idx] + '</span>';
          }, 300);
        }
      }, 2500);
    }

    function revealForm() {
      if (taglineTimer) clearInterval(taglineTimer);
      if (loadingScreen) loadingScreen.classList.remove('sqrf-active');
      if (formContainer) {
        formContainer.style.display = '';
        formContainer.style.animation = 'sqrf-fadeIn 0.4s ease';
      }
      hasLoadedForm = true;
      setMobileCollapsed(false);
      setTimeout(checkScrollFade, 100);
    }

    function fetchFestivalData() {
      var minTime = new Promise(function(r) { setTimeout(r, 3000); });
      var dataReady;

      if (fetchUrl && fetchUrl.indexOf('YOUR_') === -1) {
        setSelectLoading(festivalSelect, true);
        setSelectLoading(gradeSelect, true);

        dataReady = fetch(fetchUrl)
          .then(function(res) {
            if (!res.ok) throw new Error('Status ' + res.status);
            return res.json();
          })
          .then(function(data) {
            var source = Array.isArray(data) ? data
                       : (data.festivals && data.festivals.length) ? data.festivals
                       : null;

            if (source) {
              populateSelect(festivalSelect, transformFestivals(source));
            } else {
              populateSelect(festivalSelect, config.fallbackFestivals || []);
            }
            populateGrades([]);
          })
          .catch(function() {
            swapFestivalToTextInput();
            populateGrades(config.fallbackGrades || [], 'Select a grade\u2026');
          })
          .finally(function() {
            setSelectLoading(festivalSelect, false);
            setSelectLoading(gradeSelect, false);
          });
      } else {
        populateSelect(festivalSelect, config.fallbackFestivals || []);
        populateGrades(config.fallbackGrades || []);
        dataReady = Promise.resolve();
      }

      Promise.all([dataReady, minTime]).then(revealForm);
    }

    if (gateway) {
      var gatewayBtn = gateway.querySelector('.sqrf-gateway-btn');
      if (gatewayBtn) {
        gatewayBtn.addEventListener('click', function() {
          if (isMobileViewport()) {
            setMobileCollapsed(false);
            if (hasLoadedForm) {
              if (loadingScreen) loadingScreen.classList.remove('sqrf-active');
              if (formContainer) {
                formContainer.style.display = '';
                formContainer.style.animation = 'sqrf-fadeIn 0.3s ease';
              }
              if (gateway) gateway.style.display = 'none';
              setTimeout(checkScrollFade, 100);
              return;
            }
          }
          gateway.style.display = 'none';
          if (loadingScreen) loadingScreen.classList.add('sqrf-active');
          startTaglines();
          fetchFestivalData();
        });
      }
    }

    if (mobileMinimiseBtn) {
      mobileMinimiseBtn.addEventListener('click', function() {
        if (!isMobileViewport()) return;
        if (taglineTimer) clearInterval(taglineTimer);
        if (loadingScreen) loadingScreen.classList.remove('sqrf-active');
        if (formContainer) formContainer.style.display = 'none';
        if (gateway) gateway.style.display = 'flex';
        setMobileCollapsed(true);
      });
    }

    function swapFestivalToTextInput() {
      if (!festivalSelect) return;
      var wrap = festivalSelect.closest('.sqrf-select-wrap');
      var input = document.createElement('input');
      input.type = 'text';
      input.className = 'sqrf-input';
      input.setAttribute('data-sqrf-field', 'festival');
      input.setAttribute('placeholder', 'e.g. Tair\u0101whiti \u2014 17th May 2026');
      input.required = true;
      input.addEventListener('input', function() { input.classList.remove('sqrf-input-error'); });
      if (wrap) {
        wrap.parentNode.replaceChild(input, wrap);
      } else {
        festivalSelect.parentNode.replaceChild(input, festivalSelect);
      }
      festivalSelect = null;
    }

    var confirmH = section.querySelector('[data-sqrf-confirm-heading]');
    var confirmM = section.querySelector('[data-sqrf-confirm-msg]');
    var confirmC = section.querySelector('[data-sqrf-confirm-contact]');
    if (confirmH) confirmH.textContent = config.confirmHeading || 'Entry received!';
    if (confirmM) confirmM.textContent = config.confirmMessage || '';
    if (confirmC) confirmC.textContent = config.confirmContact || '';

    var progressContainer = section.querySelector('[data-sqrf-progress]');
    var stepLabels = config.stepLabels || ['Festival', 'Team', 'Contacts', 'Confirm'];
    stepLabels.forEach(function(label, i) {
      var step = document.createElement('div');
      step.className = 'sqrf-progress-step';
      step.setAttribute('data-sqrf-step', i);
      step.innerHTML =
        '<div class="sqrf-progress-bar"></div>' +
        '<span class="sqrf-progress-label">' + label + '</span>';
      progressContainer.appendChild(step);
    });

    function updateProgress() {
      var steps = progressContainer.querySelectorAll('.sqrf-progress-step');
      steps.forEach(function(step, i) {
        step.classList.remove('sqrf-step-active', 'sqrf-step-done');
        if (i < currentPage) step.classList.add('sqrf-step-done');
        if (i === currentPage) step.classList.add('sqrf-step-active');
      });
    }
    updateProgress();

    var pages = section.querySelectorAll('[data-sqrf-page]');

    function showPage(index) {
      pages.forEach(function(p) { p.classList.remove('sqrf-page-active'); });
      var target = section.querySelector('[data-sqrf-page="' + index + '"]');
      if (target) target.classList.add('sqrf-page-active');
      currentPage = index;
      updateProgress();
      var scrollWrap = section.querySelector('.sqrf-pages');
      if (scrollWrap) scrollWrap.scrollTop = 0;
      if (index === 1) syncInvoiceBlockVisibility();
      if (index === 2) updatePostponementCheckbox();
      setTimeout(checkScrollFade, 50);
    }

    /* ── Scroll-fade indicator ── */
    var pagesEl = section.querySelector('.sqrf-pages');
    var scrollFade = section.querySelector('[data-sqrf-scroll-fade]');
    var scrollArrow = section.querySelector('[data-sqrf-scroll-arrow]');

    function checkScrollFade() {
      if (!pagesEl) return;
      var hasOverflow = pagesEl.scrollHeight > pagesEl.clientHeight + 4;
      var nearBottom = pagesEl.scrollTop + pagesEl.clientHeight >= pagesEl.scrollHeight - 10;

      if (hasOverflow && !nearBottom) {
        if (scrollFade) scrollFade.classList.add('sqrf-fade-visible');
        if (scrollArrow) scrollArrow.classList.add('sqrf-fade-visible');
      } else {
        if (scrollFade) scrollFade.classList.remove('sqrf-fade-visible');
        if (scrollArrow) scrollArrow.classList.remove('sqrf-fade-visible');
      }
    }

    if (pagesEl) {
      pagesEl.addEventListener('scroll', checkScrollFade, { passive: true });
      window.addEventListener('resize', checkScrollFade, { passive: true });
    }

    function syncResponsiveState() {
      if (!mount) return;
      if (isMobileViewport()) {
        if (!mount.classList.contains('sqrf-mobile-expanded')) {
          setMobileCollapsed(true);
          if (formContainer) formContainer.style.display = 'none';
          if (loadingScreen) loadingScreen.classList.remove('sqrf-active');
          if (gateway) gateway.style.display = 'flex';
        }
      } else {
        mount.classList.remove('sqrf-mobile-collapsed', 'sqrf-mobile-expanded');
      }
    }

    window.addEventListener('resize', syncResponsiveState, { passive: true });
    syncResponsiveState();

    function showConfirm() {
      pages.forEach(function(p) { p.classList.remove('sqrf-page-active'); });
      var confirmScreen = section.querySelector('[data-sqrf-page="confirm"]');
      if (confirmScreen) confirmScreen.classList.add('sqrf-page-active');
      progressContainer.style.display = 'none';
    }

    function getField(name) {
      return section.querySelector('[data-sqrf-field="' + name + '"]');
    }

    function getVal(name) {
      var el = getField(name);
      if (!el) return '';
      if (el.type === 'checkbox') return el.checked;
      return (el.value || '').trim();
    }

    function showError(name, msg) {
      var errEl = section.querySelector('[data-sqrf-err="' + name + '"]');
      if (errEl) errEl.textContent = msg;
      var field = getField(name);
      if (field && field.type !== 'checkbox') field.classList.add('sqrf-input-error');
    }

    function clearErrors() {
      section.querySelectorAll('.sqrf-error-msg').forEach(function(el) { el.textContent = ''; });
      section.querySelectorAll('.sqrf-input-error').forEach(function(el) { el.classList.remove('sqrf-input-error'); });
      section.querySelectorAll('.sqrf-cb-error').forEach(function(el) { el.classList.remove('sqrf-cb-error'); });
      section.querySelectorAll('.sqrf-radio-error').forEach(function(el) { el.classList.remove('sqrf-radio-error'); });
    }

    function isValidEmail(str) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(str);
    }

    function escHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function getInvoiceChoice() {
      var radio = section.querySelector('input[name="sqrf-invoice-email-choice"]:checked');
      return radio ? radio.value : '';
    }

    function getClubInvoiceEmail() {
      if (!getVal('clubPaying')) return '';
      var choice = getInvoiceChoice();
      if (choice === 'coach') return getVal('coachEmail');
      if (choice === 'manager') return getVal('managerEmail');
      if (choice === 'other') return getVal('clubInvoiceEmailOther');
      return '';
    }

    function updateInvoiceEmailPreviews() {
      var coachPrev = section.querySelector('[data-sqrf-coach-email-preview]');
      var mgrPrev = section.querySelector('[data-sqrf-manager-email-preview]');
      var coachEm = getVal('coachEmail');
      var mgrEm = getVal('managerEmail');
      if (coachPrev) coachPrev.textContent = coachEm ? ('(' + coachEm + ')') : '(not entered yet)';
      if (mgrPrev) mgrPrev.textContent = mgrEm ? ('(' + mgrEm + ')') : '(not entered yet)';
    }

    function updateInvoiceRadioUi() {
      section.querySelectorAll('[data-sqrf-radio]').forEach(function(label) {
        var inp = label.querySelector('.sqrf-radio-input');
        if (!inp) return;
        label.classList.toggle('sqrf-radio-selected', inp.checked);
      });
      var otherInp = getField('clubInvoiceEmailOther');
      var otherRadio = section.querySelector('input[name="sqrf-invoice-email-choice"][value="other"]');
      if (otherInp && otherRadio) {
        if (otherRadio.checked) otherInp.removeAttribute('hidden');
        else otherInp.setAttribute('hidden', '');
      }
    }

    function syncInvoiceBlockVisibility() {
      var invoiceBlock = section.querySelector('[data-sqrf-invoice-block]');
      if (!invoiceBlock) return;
      if (getVal('clubPaying')) {
        invoiceBlock.removeAttribute('hidden');
      } else {
        invoiceBlock.setAttribute('hidden', '');
        section.querySelectorAll('input[name="sqrf-invoice-email-choice"]').forEach(function(r) { r.checked = false; });
        var otherInput = getField('clubInvoiceEmailOther');
        if (otherInput) {
          otherInput.value = '';
          otherInput.setAttribute('hidden', '');
          otherInput.classList.remove('sqrf-input-error');
        }
        section.querySelectorAll('[data-sqrf-radio]').forEach(function(w) {
          w.classList.remove('sqrf-radio-selected', 'sqrf-radio-error');
        });
        var errInv = section.querySelector('[data-sqrf-err="clubInvoiceEmail"]');
        if (errInv) errInv.textContent = '';
      }
      updateInvoiceEmailPreviews();
      updateInvoiceRadioUi();
    }

    function validatePage(pageIndex) {
      clearErrors();
      var valid = true;

      if (pageIndex === 0) {
        if (!getVal('festival')) { showError('festival', 'Please enter or select a festival'); valid = false; }
        if (!getVal('clubName')) { showError('clubName', 'Club name is required'); valid = false; }
        if (!getVal('teamName')) { showError('teamName', 'Team name is required'); valid = false; }
        if (getVal('grade') === CUSTOM_GRADE_VALUE) {
          if (!getVal('customGrade')) {
            showError('grade', 'Please type your grade');
            var cg = getField('customGrade'); if (cg) cg.classList.add('sqrf-input-error');
            valid = false;
          }
        } else if (!getVal('grade')) {
          showError('grade', 'Please select a grade'); valid = false;
        }
      }

      if (pageIndex === 1) {
        if (!getVal('coachName')) { showError('coachName', 'Coach name is required'); valid = false; }
        if (!getVal('coachEmail')) { showError('coachEmail', 'Coach email is required'); valid = false; }
        else if (!isValidEmail(getVal('coachEmail'))) { showError('coachEmail', 'Please enter a valid email'); valid = false; }
        if (!getVal('coachPhone')) { showError('coachPhone', 'Coach phone is required'); valid = false; }
        if (!getVal('managerName')) { showError('managerName', 'Manager name is required'); valid = false; }
        if (!getVal('managerEmail')) { showError('managerEmail', 'Manager email is required'); valid = false; }
        else if (!isValidEmail(getVal('managerEmail'))) { showError('managerEmail', 'Please enter a valid email'); valid = false; }
        if (!getVal('managerPhone')) { showError('managerPhone', 'Manager phone is required'); valid = false; }

        if (getVal('clubPaying')) {
          var choice = getInvoiceChoice();
          if (!choice) {
            showError('clubInvoiceEmail', 'Please choose an invoice email');
            valid = false;
            section.querySelectorAll('[data-sqrf-invoice-block] [data-sqrf-radio]').forEach(function(el) { el.classList.add('sqrf-radio-error'); });
          } else if (choice === 'coach') {
            if (!getVal('coachEmail') || !isValidEmail(getVal('coachEmail'))) {
              showError('clubInvoiceEmail', 'Coach email is required to use it as the invoice email');
              valid = false;
              var coachLbl = section.querySelector('[data-sqrf-radio="coach"]');
              if (coachLbl) coachLbl.classList.add('sqrf-radio-error');
            }
          } else if (choice === 'manager') {
            if (!getVal('managerEmail') || !isValidEmail(getVal('managerEmail'))) {
              showError('clubInvoiceEmail', 'Manager email is required to use it as the invoice email');
              valid = false;
              var mgrLbl = section.querySelector('[data-sqrf-radio="manager"]');
              if (mgrLbl) mgrLbl.classList.add('sqrf-radio-error');
            }
          } else if (choice === 'other') {
            var otherEm = getVal('clubInvoiceEmailOther');
            if (!otherEm || !isValidEmail(otherEm)) {
              showError('clubInvoiceEmail', 'Please enter a valid invoice email');
              valid = false;
              var otherEl = getField('clubInvoiceEmailOther');
              if (otherEl) otherEl.classList.add('sqrf-input-error');
            }
          }
        }
      }

      if (pageIndex === 2) {
        var allChecked = true;
        var requiredCbs = ['terms', 'health'];
        var postponeCb = section.querySelector('[data-sqrf-cb="postponement"]');
        if (postponeCb && !postponeCb.hasAttribute('hidden')) {
          requiredCbs.push('postponement');
        }
        requiredCbs.forEach(function(name) {
          if (!getVal(name)) {
            allChecked = false;
            var cbWrap = section.querySelector('[data-sqrf-cb="' + name + '"]');
            if (cbWrap) cbWrap.classList.add('sqrf-cb-error');
          }
        });
        if (!allChecked) {
          showError('checkboxes', 'Please acknowledge the required confirmations to proceed');
          valid = false;
        }
      }

      return valid;
    }

    section.querySelectorAll('.sqrf-checkbox-field').forEach(function(wrap) {
      var input = wrap.querySelector('.sqrf-checkbox-input');
      if (!input) return;
      input.addEventListener('change', function() {
        wrap.classList.toggle('sqrf-cb-checked', input.checked);
        wrap.classList.remove('sqrf-cb-error');
        if (input.getAttribute('data-sqrf-field') === 'clubPaying') {
          syncInvoiceBlockVisibility();
        }
      });
    });

    section.querySelectorAll('input[name="sqrf-invoice-email-choice"]').forEach(function(r) {
      r.addEventListener('change', function() {
        updateInvoiceRadioUi();
        section.querySelectorAll('[data-sqrf-invoice-block] [data-sqrf-radio]').forEach(function(w) { w.classList.remove('sqrf-radio-error'); });
        var errInv = section.querySelector('[data-sqrf-err="clubInvoiceEmail"]');
        if (errInv) errInv.textContent = '';
      });
    });

    section.querySelectorAll('.sqrf-input, .sqrf-select, .sqrf-textarea').forEach(function(el) {
      el.addEventListener('input', function() {
        el.classList.remove('sqrf-input-error');
        if (el.getAttribute('data-sqrf-field') === 'discountCode') buildSummary();
        var fname = el.getAttribute('data-sqrf-field');
        if (fname === 'coachEmail' || fname === 'managerEmail') updateInvoiceEmailPreviews();
      });
      el.addEventListener('change', function() { el.classList.remove('sqrf-input-error'); });
    });

    syncInvoiceBlockVisibility();

    function isCustomGrade() { return getVal('grade') === CUSTOM_GRADE_VALUE; }
    function getEffectiveGrade() { return isCustomGrade() ? getVal('customGrade') : getVal('grade'); }

    function getFestivalLabel() {
      var festivalEl = getField('festival');
      if (!festivalEl) return '';
      if (festivalEl.tagName === 'SELECT' && festivalEl.selectedIndex > 0) {
        return festivalEl.options[festivalEl.selectedIndex].text;
      }
      return (festivalEl.value || '').trim();
    }

    function getFestivalRecordId() {
      var val = getVal('festival');
      return festivalRecordIdMap[val] || '';
    }

    function buildSummary() {
      var summaryEl = section.querySelector('[data-sqrf-summary]');
      if (!summaryEl) return;

      var festivalLabel = getFestivalLabel();

      var rows = [
        { key: 'Festival', val: festivalLabel },
        { key: 'Club', val: getVal('clubName') },
        { key: 'Team', val: getVal('teamName') },
        { key: 'Grade', val: getEffectiveGrade() },
        { key: 'Club paying', val: getVal('clubPaying') ? 'Yes' : 'No' }
      ];
      if (getVal('clubPaying')) {
        rows.push({ key: 'Invoice email', val: getClubInvoiceEmail() });
      }
      rows.push(
        { key: 'Coach', val: getVal('coachName') },
        { key: 'Manager', val: getVal('managerName') }
      );
      var discountCode = getVal('discountCode');
      if (discountCode) rows.push({ key: 'Discount Code', val: discountCode });

      summaryEl.innerHTML = rows.map(function(r) {
        return '<div class="sqrf-summary-row">' +
          '<span class="sqrf-summary-key">' + escHtml(r.key) + '</span>' +
          '<span class="sqrf-summary-val">' + (escHtml(r.val) || '\u2014') + '</span>' +
        '</div>';
      }).join('');
    }

    section.querySelectorAll('[data-sqrf-next]').forEach(function(btn) {
      btn.addEventListener('click', function() {
        if (!validatePage(currentPage)) return;
        if (currentPage < totalPages - 1) {
          if (currentPage + 1 === 3) buildSummary();
          showPage(currentPage + 1);
        }
      });
    });

    section.querySelectorAll('[data-sqrf-prev]').forEach(function(btn) {
      btn.addEventListener('click', function() {
        clearErrors();
        if (currentPage > 0) showPage(currentPage - 1);
      });
    });

    var submitBtn = section.querySelector('[data-sqrf-submit]');
    var isSubmitting = false;
    if (submitBtn) {
      submitBtn.addEventListener('click', function() {
        if (isSubmitting) return;
        clearErrors();
        var endpoint = config.submitEndpoint;
        if (!endpoint || endpoint.indexOf('YOUR_') !== -1) {
          showError('submit', 'No submission endpoint configured');
          return;
        }

        var payload = {
          festival: getVal('festival'),
          festivalLabel: getFestivalLabel(),
          festivalRecordId: getFestivalRecordId(),
          clubName: getVal('clubName'),
          teamName: getVal('teamName'),
          grade: isCustomGrade() ? 'Custom' : getVal('grade'),
          customGrade: isCustomGrade() ? getVal('customGrade') : '',
          clubPaying: getVal('clubPaying'),
          clubInvoiceEmail: getClubInvoiceEmail(),
          clubInvoiceEmailSource: getInvoiceChoice(),
          discountCode: getVal('discountCode'),
          coachName: getVal('coachName'),
          coachEmail: getVal('coachEmail'),
          coachPhone: getVal('coachPhone'),
          managerName: getVal('managerName'),
          managerEmail: getVal('managerEmail'),
          managerPhone: getVal('managerPhone'),
          termsAccepted: getVal('terms'),
          healthAccepted: getVal('health'),
          coachingConfirmed: getVal('coaching'),
          postponementAcknowledged: getVal('postponement'),
          postponementDate: festivalPostponementMap[getVal('festival')] || '',
          additionalInfo: getVal('additionalInfo'),
          submittedAt: new Date().toISOString()
        };

        isSubmitting = true;
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="sqrf-spinner"></span>Submitting\u2026';

        fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        })
        .then(function(res) {
          if (!res.ok) throw new Error('Server responded with ' + res.status);
          showConfirm();
        })
        .catch(function(err) {
          isSubmitting = false;
          submitBtn.disabled = false;
          submitBtn.textContent = 'Submit Entry';
          showError('submit', 'Submission failed \u2014 please try again. (' + err.message + ')');
        });
      });
    }
  }

  /* ── Boot: wait for DOM, then inject ── */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>

<!--
  ============================================================
  AIRTABLE + MAKE.COM SETUP GUIDE
  ============================================================

  OVERVIEW
  --------
  This form uses two Make.com webhooks:
    1. FETCH webhook — reads festival & grade options from Airtable (GET)
    2. SUBMIT webhook — writes registration entries to Airtable (POST)

  Your Airtable API key stays safe inside Make.com — never exposed
  in the browser.


  STEP 1: AIRTABLE TABLES
  ────────────────────────
  Create a base called "Rugby Festivals" (or similar) with these tables:

  Table: "Festivals"
  ┌─────────────┬──────────┬─────────────────────────────────────────┐
  │ Field       │ Type     │ Example                                 │
  ├─────────────┼──────────┼─────────────────────────────────────────┤
  │ Name        │ Text     │ Tairāwhiti                              │
  │ Date        │ Date     │ 2025-05-18                              │
  │ Label       │ Formula  │ Name & " — " & IF(Date, DATETIME_FORMAT │

  CUSTOM GRADE HANDLING
  ─────────────────────
  The Grade dropdown ends with a "Can't find your grade? Add your
  details to go on the waitlist" option that reveals a free-text input.
  (Grades the team has marked full are filtered out of the dropdown, so
  this is effectively the waitlist path.) When a registrant uses it, the
  form sends:
      grade        = "Custom"   (a fixed marker, NOT the typed text)
      customGrade  = "<the free text they typed>"
  For a normal selection, grade = the chosen grade and customGrade = "".

  This keeps free text OUT of the predefined Grade field so Airtable
  never tries (and fails) to match it to an existing option. To support
  this in Airtable:
    • If the Grade field is a Single Select, add a choice named "Custom"
      so the {{grade}} marker maps cleanly.
    • Map {{customGrade}} to the separate "Custom Grade" text column,
      where the actual typed grade is recorded for the organisers.
